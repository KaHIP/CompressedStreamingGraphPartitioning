<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="250" rx="12" ry="12" fill="#1a1d23"/>

  <!-- Title: "Stream" in teal, "CPI" in amber -->
  <text x="40" y="95" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="56">
    <tspan fill="#00bcd4">Stream</tspan><tspan fill="#f39c12">CPI</tspan>
  </text>

  <!-- Subtitle -->
  <text x="42" y="125" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#aaaaaa">
    Memory-Efficient Streaming Graph Partitioning
  </text>

  <!-- Second subtitle line -->
  <text x="42" y="147" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#777777">
    Run-Length Compressed Partition Indices for Trillion-Edge Graphs
  </text>

  <!-- Part of KaHIP badge -->
  <rect x="42" y="165" width="105" height="24" rx="12" ry="12" fill="#5a7a5a" fill-opacity="0.35" stroke="#5a7a5a" stroke-opacity="0.5" stroke-width="1"/>
  <text x="94" y="181.5" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#8faa8f">Part of KaHIP</text>

  <!-- ACDA 2025 badge -->
  <rect x="158" y="165" width="82" height="24" rx="12" ry="12" fill="#f1c40f" fill-opacity="0.12" stroke="#f1c40f" stroke-opacity="0.35" stroke-width="1"/>
  <text x="199" y="181.5" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#f1c40f">ACDA 2025</text>

  <!-- === Streaming diagram (right side) === -->

  <!-- Input stream track -->
  <line x1="390" y1="125" x2="520" y2="125" stroke="#555" stroke-width="1.5"/>
  <!-- Arrow on stream -->
  <polygon points="518,121 526,125 518,129" fill="#666"/>

  <!-- Streaming nodes (incoming, fading in) -->
  <circle cx="400" cy="125" r="3.5" fill="#666" opacity="0.2" filter="url(#glow)"/>
  <circle cx="418" cy="125" r="4" fill="#888" opacity="0.3" filter="url(#glow)"/>
  <circle cx="438" cy="125" r="4.5" fill="#aaa" opacity="0.45" filter="url(#glow)"/>
  <circle cx="460" cy="125" r="5" fill="#bbb" opacity="0.6" filter="url(#glow)"/>
  <circle cx="484" cy="125" r="5.5" fill="#ccc" opacity="0.75" filter="url(#glow)"/>
  <circle cx="510" cy="125" r="6" fill="#ddd" opacity="0.88" filter="url(#glow)"/>

  <!-- Stream label -->
  <text x="450" y="108" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#666">stream input</text>

  <!-- Compression zone (middle) -->
  <rect x="535" y="75" width="100" height="100" rx="6" ry="6" fill="#00bcd4" fill-opacity="0.06" stroke="#00bcd4" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Compression label -->
  <text x="585" y="68" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#00bcd4" opacity="0.6">RLE compress</text>

  <!-- Compressed blocks inside zone (run-length visualization) -->
  <!-- Run of red (3x) -->
  <rect x="545" y="92" width="12" height="12" rx="2" fill="#e74c3c" opacity="0.7"/>
  <rect x="560" y="92" width="12" height="12" rx="2" fill="#e74c3c" opacity="0.7"/>
  <rect x="575" y="92" width="12" height="12" rx="2" fill="#e74c3c" opacity="0.7"/>
  <!-- Bracket for run -->
  <path d="M545,107 L545,111 L587,111 L587,107" fill="none" stroke="#e74c3c" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="566" y="120" text-anchor="middle" font-family="monospace" font-size="8" fill="#e74c3c" opacity="0.6">3x</text>

  <!-- Run of blue (2x) -->
  <rect x="593" y="92" width="12" height="12" rx="2" fill="#3498db" opacity="0.7"/>
  <rect x="608" y="92" width="12" height="12" rx="2" fill="#3498db" opacity="0.7"/>
  <path d="M593,107 L593,111 L620,111 L620,107" fill="none" stroke="#3498db" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="606.5" y="120" text-anchor="middle" font-family="monospace" font-size="8" fill="#3498db" opacity="0.6">2x</text>

  <!-- Run of green (2x) -->
  <rect x="545" y="132" width="12" height="12" rx="2" fill="#2ecc71" opacity="0.7"/>
  <rect x="560" y="132" width="12" height="12" rx="2" fill="#2ecc71" opacity="0.7"/>
  <path d="M545,147 L545,151 L572,151 L572,147" fill="none" stroke="#2ecc71" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="558.5" y="160" text-anchor="middle" font-family="monospace" font-size="8" fill="#2ecc71" opacity="0.6">2x</text>

  <!-- Run of red (1x) -->
  <rect x="578" y="132" width="12" height="12" rx="2" fill="#e74c3c" opacity="0.7"/>
  <text x="584" y="160" text-anchor="middle" font-family="monospace" font-size="8" fill="#e74c3c" opacity="0.6">1x</text>

  <!-- Run of blue (2x) -->
  <rect x="596" y="132" width="12" height="12" rx="2" fill="#3498db" opacity="0.7"/>
  <rect x="611" y="132" width="12" height="12" rx="2" fill="#3498db" opacity="0.7"/>
  <path d="M596,147 L596,151 L623,151 L623,147" fill="none" stroke="#3498db" stroke-opacity="0.4" stroke-width="0.8"/>
  <text x="609.5" y="160" text-anchor="middle" font-family="monospace" font-size="8" fill="#3498db" opacity="0.6">2x</text>

  <!-- Branching dashed paths from compression to partition blocks -->
  <path d="M635,100 Q660,100 680,65" fill="none" stroke="#e74c3c" stroke-width="1.2" stroke-dasharray="4,3" stroke-opacity="0.5"/>
  <path d="M635,125 Q660,125 680,125" fill="none" stroke="#3498db" stroke-width="1.2" stroke-dasharray="4,3" stroke-opacity="0.5"/>
  <path d="M635,150 Q660,150 680,185" fill="none" stroke="#2ecc71" stroke-width="1.2" stroke-dasharray="4,3" stroke-opacity="0.5"/>

  <!-- Partition block 1 (red) -->
  <rect x="680" y="40" width="190" height="50" rx="6" ry="6" fill="#e74c3c" fill-opacity="0.06" stroke="#e74c3c" stroke-opacity="0.18" stroke-width="1"/>
  <!-- Nodes in block 1 -->
  <circle cx="715" cy="65" r="6.5" fill="#e74c3c" filter="url(#glow)"/>
  <circle cx="755" cy="55" r="6.5" fill="#e74c3c" filter="url(#glow)"/>
  <circle cx="795" cy="65" r="6.5" fill="#e74c3c" filter="url(#glow)"/>
  <circle cx="835" cy="58" r="6.5" fill="#e74c3c" filter="url(#glow)"/>
  <!-- Edges in block 1 -->
  <path d="M715,65 Q735,50 755,55" fill="none" stroke="#e74c3c" stroke-opacity="0.3" stroke-width="1.2"/>
  <path d="M755,55 Q775,55 795,65" fill="none" stroke="#e74c3c" stroke-opacity="0.3" stroke-width="1.2"/>
  <path d="M795,65 Q815,55 835,58" fill="none" stroke="#e74c3c" stroke-opacity="0.3" stroke-width="1.2"/>

  <!-- Partition block 2 (blue) -->
  <rect x="680" y="100" width="190" height="50" rx="6" ry="6" fill="#3498db" fill-opacity="0.06" stroke="#3498db" stroke-opacity="0.18" stroke-width="1"/>
  <!-- Nodes in block 2 -->
  <circle cx="710" cy="128" r="6.5" fill="#3498db" filter="url(#glow)"/>
  <circle cx="750" cy="118" r="6.5" fill="#3498db" filter="url(#glow)"/>
  <circle cx="790" cy="128" r="6.5" fill="#3498db" filter="url(#glow)"/>
  <circle cx="830" cy="122" r="6.5" fill="#3498db" filter="url(#glow)"/>
  <!-- Edges in block 2 -->
  <path d="M710,128 Q730,112 750,118" fill="none" stroke="#3498db" stroke-opacity="0.3" stroke-width="1.2"/>
  <path d="M750,118 Q770,120 790,128" fill="none" stroke="#3498db" stroke-opacity="0.3" stroke-width="1.2"/>
  <path d="M790,128 Q810,118 830,122" fill="none" stroke="#3498db" stroke-opacity="0.3" stroke-width="1.2"/>

  <!-- Partition block 3 (green) -->
  <rect x="680" y="160" width="190" height="50" rx="6" ry="6" fill="#2ecc71" fill-opacity="0.06" stroke="#2ecc71" stroke-opacity="0.18" stroke-width="1"/>
  <!-- Nodes in block 3 -->
  <circle cx="712" cy="185" r="6.5" fill="#2ecc71" filter="url(#glow)"/>
  <circle cx="752" cy="178" r="6.5" fill="#2ecc71" filter="url(#glow)"/>
  <circle cx="792" cy="188" r="6.5" fill="#2ecc71" filter="url(#glow)"/>
  <circle cx="832" cy="182" r="6.5" fill="#2ecc71" filter="url(#glow)"/>
  <!-- Edges in block 3 -->
  <path d="M712,185 Q732,172 752,178" fill="none" stroke="#2ecc71" stroke-opacity="0.3" stroke-width="1.2"/>
  <path d="M752,178 Q772,180 792,188" fill="none" stroke="#2ecc71" stroke-opacity="0.3" stroke-width="1.2"/>
  <path d="M792,188 Q812,178 832,182" fill="none" stroke="#2ecc71" stroke-opacity="0.3" stroke-width="1.2"/>

  <!-- Block labels -->
  <text x="775" y="37" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#666">partition blocks</text>

  <!-- Bottom caption -->
  <text x="585" y="235" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#555">
    run-length compressed streaming graph partitioning
  </text>

  <!-- Legend -->
  <circle cx="400" cy="220" r="4" fill="#e74c3c" opacity="0.7"/>
  <text x="410" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#888">block 1</text>
  <circle cx="465" cy="220" r="4" fill="#3498db" opacity="0.7"/>
  <text x="475" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#888">block 2</text>
  <circle cx="530" cy="220" r="4" fill="#2ecc71" opacity="0.7"/>
  <text x="540" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#888">block 3</text>
  <!-- Compression legend -->
  <rect x="590" y="216" width="8" height="8" rx="1.5" fill="#00bcd4" opacity="0.5"/>
  <text x="603" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#888">RLE</text>
</svg>
